  :root {
    --font-serif: "NotoSerifTC-Q", "Songti TC", "Noto Serif TC", "PingFang TC", "STSong", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --font-brand: "Helvetica Neue Condensed", "Arial Narrow", "PingFang TC", Arial, sans-serif;

    --ink: #2A2330;
    --ink-soft: rgba(42, 35, 48, 0.64);
    --ink-faint: rgba(42, 35, 48, 0.40);
    --paper: #F3E9E1;
    --paper-raised: #FBF5EF;
    --paper-back: #2A2330;
    --line: rgba(42, 35, 48, 0.12);
    --line-soft: rgba(42, 35, 48, 0.07);
    --shadow-color: 42, 35, 48;
    --mood: 121, 111, 100;

    --flip-duration: 620ms;
    --swap-duration: 380ms;
    --bg-duration: 900ms;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #F1E7DE;
      --ink-soft: rgba(241, 231, 222, 0.68);
      --ink-faint: rgba(241, 231, 222, 0.42);
      --paper: #211B26;
      --paper-raised: #2E2635;
      --paper-back: #16121A;
      --line: rgba(241, 231, 222, 0.12);
      --line-soft: rgba(241, 231, 222, 0.07);
      --shadow-color: 0, 0, 0;
      --mood: 200, 190, 178;
    }
  }
  :root[data-theme="dark"] {
    --ink: #F1E7DE;
    --ink-soft: rgba(241, 231, 222, 0.68);
    --ink-faint: rgba(241, 231, 222, 0.42);
    --paper: #211B26;
    --paper-raised: #2E2635;
    --paper-back: #16121A;
    --line: rgba(241, 231, 222, 0.12);
    --line-soft: rgba(241, 231, 222, 0.07);
    --shadow-color: 0, 0, 0;
    --mood: 200, 190, 178;
  }
  :root[data-theme="light"] {
    --ink: #2A2330;
    --ink-soft: rgba(42, 35, 48, 0.64);
    --ink-faint: rgba(42, 35, 48, 0.40);
    --paper: #F3E9E1;
    --paper-raised: #FBF5EF;
    --paper-back: #2A2330;
    --line: rgba(42, 35, 48, 0.12);
    --line-soft: rgba(42, 35, 48, 0.07);
    --shadow-color: 42, 35, 48;
    --mood: 121, 111, 100;
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --flip-duration: 0.001ms; --swap-duration: 0.001ms; --bg-duration: 0.001ms; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: var(--paper);
    background-image: radial-gradient(circle at 50% 8%, rgba(var(--mood), 0.22), transparent 55%);
    transition: background-image var(--bg-duration) ease;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    padding: 44px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .kicker {
    font-family: var(--font-brand);
    font-size: 12px;
    letter-spacing: 0.34em;
    color: var(--ink-faint);
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-brand);
    font-size: clamp(38px, 11vw, 56px);
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 12px 0 16px;
    text-wrap: balance;
    text-align: center;
  }

  .lede {
    font-family: "NotoSerifTC-Q-Light", "Songti TC", "Noto Serif TC", "PingFang TC", "STSong", serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.75;
    color: var(--ink-soft);
    text-align: center;
    max-width: 340px;
    margin: 0 0 30px;
  }

  .levels {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 34px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    border-radius: 8px;
    padding: 7px 12px 7px 10px;
    font-family: var(--font-brand);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .chip:hover { border-color: var(--ink-faint); }
  .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dot-color, currentColor);
    flex: none;
  }
  .chip.on {
    color: var(--ink);
    border-color: transparent;
    background: var(--chip-bg);
  }
  .chip.off .dot { opacity: 0.35; }

  .card-wrap {
    width: min(78vw, 300px, calc(52vh * 5 / 7));
    aspect-ratio: 5 / 7;
    perspective: 1400px;
    margin-bottom: 22px;
    flex: none;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; border-radius: 20px; }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--flip-duration) cubic-bezier(.4,.1,.2,1);
  }
  .card.revealed .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 40px -14px rgba(var(--shadow-color), 0.38), 0 2px 8px rgba(var(--shadow-color), 0.08);
    overflow: hidden;
  }
  .face::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: overlay;
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.09) 1px, transparent 0);
    background-size: 3px 3px;
  }

  .face-back {
    background: var(--paper-back);
    color: rgba(255,255,255,0.86);
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .face-back svg { width: 96px; height: 96px; opacity: 0.85; transition: stroke var(--bg-duration) ease; }
  .face-back .hint {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.55);
  }
  .face-back .back-brand {
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.32);
  }

  .face-front {
    background: var(--paper-raised);
    transform: rotateY(180deg);
    padding: 22px 22px 20px;
    justify-content: space-between;
  }
  .card:not(.revealed) .face-front { visibility: hidden; }

  .tag-row { display: flex; justify-content: space-between; align-items: center; }

  .lv-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-brand);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--tag-bg, var(--line-soft));
    color: var(--ink);
  }
  .lv-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tag-dot, var(--ink)); flex: none; }

  .deck-tagline {
    font-family: var(--font-brand);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 7px 0 0 2px;
  }

  .q-index {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .q-body {
    flex: 1;
    display: flex;
    align-items: center;
  }

  .q-text {
    font-family: var(--font-serif);
    font-size: clamp(19px, 5vw, 23px);
    font-weight: 500;
    line-height: 1.68;
    color: var(--ink);
    transition: opacity var(--swap-duration) ease;
  }
  .q-text.swapping { opacity: 0; }

  .face-front .foot-line {
    height: 1px;
    background: var(--line);
    margin-bottom: 8px;
  }
  .face-front .foot-name {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }

  .draw-btn {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--paper-raised);
    background: var(--ink);
    border: none;
    border-radius: 10px;
    padding: 13px 30px;
    cursor: pointer;
    box-shadow: 0 10px 24px -8px rgba(var(--mood), 0.55);
    transition: box-shadow var(--bg-duration) ease, transform 120ms ease, opacity 160ms ease;
  }
  .draw-btn:hover { transform: translateY(-1px); }
  .draw-btn:active { transform: translateY(0); }
  .draw-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .draw-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .progress {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .progress .bar {
    width: 84px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .progress .bar > span {
    display: block;
    height: 100%;
    background: rgb(var(--mood));
    transition: width 220ms ease, background var(--bg-duration) ease;
  }

  .reset {
    margin-top: 26px;
    font-size: 12px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 160ms ease, color 160ms ease;
  }
  .reset:hover { color: var(--ink-soft); text-decoration-color: var(--ink-faint); }
  .reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  @media (max-width: 360px) {
    .stage { padding: 32px 16px 32px; }
  }
</style>

          <div class="deck-tagline" id="deckTagline"></div>
          <div class="q-body">
            <p class="q-text" id="qText"></p>
          </div>
          <div>
            <div class="foot-line"></div>
            <div class="foot-name" id="foutName"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="draw-btn" id="drawBtn">抽一張卡</button>

  <div class="progress">
    <span id="progressText">已抽 0 張</span>
    <span class="bar"><span id="progressBar" style="width:0%"></span></span>
  </div>

  <button class="reset" id="resetBtn">重新開始整副牌</button>

  <span class="sr-only" role="status" aria-live="polite" id="liveRegion"></span>
</div>

<script>
(function () {
  var LEVELS = [
    { id: 1, name: '火花', tagline: 'Attraction・Curiosity', color: '#6E9B5E', questions: [

      '如果只能問我一個問題，你最想知道什麼？',
      '現在，你對我的好奇心有幾分？（1–10 分）'
    ]},
    { id: 2, name: '坦誠', tagline: 'Dating・Values・Boundaries', color: '#C99A3E', questions: [
      '你通常怎麼知道自己開始喜歡一個人？',
      '你最容易因為什麼吃醋？',
      '吃醋時，你通常會說出來還是藏起來？',

      '你最害怕別人誤解你的哪一面？',
      '在關係裡，你最需要的是自由、穩定、激情還是陪伴？',
      '你通常怎麼表達「我在乎你」？',
      '你希望別人怎麼表達在乎？',
      '哪一種道歉最能打動你？',
      '有沒有一條界線，是你不願意妥協的？',
      '你有沒有曾經為了迎合別人，而委屈自己？',
      '你最希望對方主動問你的問題是什麼？',
      '你最不喜歡被貼上的標籤是什麼？',
      '如果今天開始無法聯絡一週，你最擔心的是什麼？',
      '你認為「信任」是建立出來的，還是給出來的？',
      '你希望一段關係保留多少個人空間？',
      '你曾經在哪段關係裡最像自己？',
      '有沒有一個問題，你一直希望有人問你？'
    ]},
    { id: 3, name: '慾望', tagline: 'Intimacy・Chemistry・Sex', color: '#C1703B', questions: [
      '對你而言，性感比較來自外表、態度，還是氣場？',
      '哪一種眼神最容易讓你心動？',
      '哪種肢體接觸最容易讓你覺得親近？',
      '你喜歡慢慢培養曖昧，還是直接表達吸引？',
      '有哪些行為比接吻更親密？',
      '你覺得性吸引通常是瞬間產生，還是慢慢累積？',
      '有沒有一種親密互動，比性愛更能讓你感受到連結？',
      '你最希望別人怎麼確認你的同意？',
      '哪種稱讚最容易讓你害羞？',
      '你最喜歡收到哪種形式的調情？',
      '什麼情況下，你最容易主動表達需求？',
      '有哪些界線，希望不用解釋對方就會尊重？',
      '有沒有一個和性有關的迷思，你曾經相信過？',
      '你覺得慾望需要被說出口嗎？',
      '如果沒有任何尷尬，你最想和對方聊哪個親密話題？',
      '你喜歡循序漸進，還是讓火花自然發生？',
      '有沒有一件事，會讓你瞬間失去性吸引？',
      '對你而言，什麼才是真正的化學反應？',
      '如果要用一個詞形容你的親密風格，你會選什麼？',
      '你希望別人如何知道「現在是適合靠近你的時候」？'
    ]},
    { id: 4, name: '赤裸', tagline: 'Vulnerability・Fear・Truth', color: '#A94B4E', questions: [
      '你最害怕別人離開你的方式是什麼？',
      '最近一次哭，是因為什麼？',
      '你有沒有一個一直沒放下的人或遺憾？',
      '你最怕自己在關係裡變成什麼樣的人？',
      '如果現在停止認識彼此，你會覺得可惜嗎？為什麼？',
      '你最不容易原諒自己的事情是什麼？',
      '你通常怎麼保護自己不受傷？',
      '有沒有一件事，你一直希望有人理解？',
      '你最渴望被看見的是哪一面？',
      '有沒有一句話，你一直想對某個人說卻沒說？',
      '你最需要安全感的時候，通常是什麼時候？',
      '你最害怕失去自由，還是失去連結？',
      '你會因為害怕失望，而不敢期待嗎？',
      '有沒有一個秘密，是現在的你願意分享的？',
      '你希望別人記住你的哪個樣子？',
      '你最想改變自己的哪一部分？',
      '如果今天只能誠實一次，你最想說什麼？',
      '你最近一次覺得「終於有人懂我」是在什麼時候？',
      '你覺得自己值得被好好愛嗎？為什麼？',
      '哪一題，你最希望我也回答？'
    ]},
    { id: 5, name: '夜語', tagline: 'Honest・Playful・Closer', color: '#4F3E73', questions: [
      '今天聊到現在，你對我的印象改變了什麼？',
      '哪一題最難回答？為什麼？',
      '哪一題你最想反問我？',
      '如果今晚只能再問一題，你會問什麼？',
      '現在，你最想知道我的哪個秘密？',
      '如果今晚結束前只能完成一件事，你希望是什麼？',
      '現在的你，比剛見面時更想靠近我，還是更想保持距離？',
      '你希望我更主動，還是更克制？',
      '如果今天可以重來一次，你會做什麼不同的事？',
      '今天哪一刻，你最有連結感？',
      '如果我們一個月後再見，你希望有什麼改變？',
      '如果今天是最後一次見面，你希望我記得你什麼？',
      '有沒有一件事，你很高興今天終於說出口？',
      '今天有哪一題，改變了你的想法？',
      '有哪個答案讓你最驚訝？',
      '你覺得我們還有哪個話題沒聊到？',
      '如果今天只能留下一句話給我，你會說什麼？',
      '你希望下一次見面，我們聊什麼？',
      '現在的你，願意再次和我玩一輪嗎？為什麼？',
      '最後一題：請說一句你現在最真實的感受，不用考慮它是否「好聽」。'
    ]}
  ];

  var active = {};
  LEVELS.forEach(function (lv) { active[lv.id] = !lv.bonus; });

  var deck = [];
  var pointer = 0;
  var drawnCount = 0;
  var lastKey = null;
  var revealedOnce = false;
  var busy = false;

  var ambientEl = document.getElementById('ambient');
  var levelsEl = document.getElementById('levels');
  var cardEl = document.getElementById('card');
  var lvTagEl = document.getElementById('lvTag');
  var qIndexEl = document.getElementById('qIndex');
  var qTextEl = document.getElementById('qText');
  var footNameEl = document.getElementById('foutName');
  var deckTaglineEl = document.getElementById('deckTagline');
  var drawBtn = document.getElementById('drawBtn');
  var progressText = document.getElementById('progressText');
  var progressBar = document.getElementById('progressBar');
  var resetBtn = document.getElementById('resetBtn');
  var liveRegion = document.getElementById('liveRegion');

  function hexToRgb(hex) {
    var m = hex.replace('#', '');
    var r = parseInt(m.substring(0, 2), 16);
    var g = parseInt(m.substring(2, 4), 16);
    var b = parseInt(m.substring(4, 6), 16);
    return r + ', ' + g + ', ' + b;
  }

  function buildLevelChips() {
    levelsEl.innerHTML = '';
    LEVELS.forEach(function (lv) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip ' + (active[lv.id] ? 'on' : 'off');
      chip.style.setProperty('--dot-color', lv.color);
      chip.style.setProperty('--chip-bg', 'rgba(' + hexToRgb(lv.color) + ', 0.16)');
      chip.setAttribute('aria-pressed', active[lv.id] ? 'true' : 'false');
      chip.innerHTML = '<span class="dot"></span>' + lv.name;
      chip.addEventListener('click', function () {
        active[lv.id] = !active[lv.id];
        buildLevelChips();
        rebuildDeck();
      });
      levelsEl.appendChild(chip);
    });
  }

  function totalPool() {
    var n = 0;
    LEVELS.forEach(function (lv) { if (active[lv.id]) n += lv.questions.length; });
    return n;
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function freshDeck() {
    var pool = [];
    LEVELS.forEach(function (lv) {
      if (!active[lv.id]) return;
      lv.questions.forEach(function (q, i) {
        pool.push({ levelId: lv.id, qIndexInLevel: i, text: q });
      });
    });
    shuffle(pool);
    if (lastKey && pool.length > 1) {
      var first = pool[0].levelId + ':' + pool[0].qIndexInLevel;
      if (first === lastKey) {
        var t = pool[0]; pool[0] = pool[1]; pool[1] = t;
      }
    }
    return pool;
  }

  function rebuildDeck() {
    deck = freshDeck();
    pointer = 0;
    drawnCount = 0;
    lastKey = null;
    revealedOnce = false;
    cardEl.classList.remove('revealed');
    updateProgress();
    updateDrawAvailability();
  }

  function updateDrawAvailability() {
    var enabled = totalPool() > 0;
    drawBtn.disabled = !enabled;
    cardEl.setAttribute('aria-disabled', enabled ? 'false' : 'true');
  }

  function updateProgress() {
    var total = deck.length || 1;
    var pct = Math.round((pointer / total) * 100);
    progressText.textContent = '已抽 ' + drawnCount + ' 張';
    progressBar.style.width = pct + '%';
  }

  function applyMood(hex) {
    ambientEl.style.setProperty('--mood', hexToRgb(hex));
    document.documentElement.style.setProperty('--mood', hexToRgb(hex));
  }

  function renderCard(card, level) {
    lvTagEl.innerHTML = '<span class="dot"></span><span>' + pad(level.id) + ' · ' + level.name + '</span>';
    lvTagEl.style.setProperty('--tag-bg', 'rgba(' + hexToRgb(level.color) + ', 0.18)');
    lvTagEl.style.setProperty('--tag-dot', level.color);
    qIndexEl.textContent = pad(card.qIndexInLevel + 1) + ' / ' + pad(level.questions.length);
    deckTaglineEl.textContent = level.tagline;
    qTextEl.textContent = card.text;
    footNameEl.textContent = drawnCount + ' 之 ' + (deck.length);
    applyMood(level.color);
    liveRegion.textContent = level.name + '：' + card.text;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function levelById(id) {
    for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === id) return LEVELS[i];
  }

  function draw() {
    if (busy || totalPool() === 0) return;
    if (pointer >= deck.length) {
      deck = freshDeck();
      pointer = 0;
    }
    var card = deck[pointer++];
    drawnCount++;
    lastKey = card.levelId + ':' + card.qIndexInLevel;
    var level = levelById(card.levelId);

    if (!revealedOnce) {
      revealedOnce = true;
      renderCard(card, level);
      cardEl.classList.add('revealed');
    } else {
      busy = true;
      qTextEl.classList.add('swapping');
      var d = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--swap-duration')) || 380;
      setTimeout(function () {
        renderCard(card, level);
        qTextEl.classList.remove('swapping');
        busy = false;
      }, Math.max(d, 1));
    }
    updateProgress();
  }

  drawBtn.addEventListener('click', draw);
  cardEl.addEventListener('click', draw);
  cardEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); draw(); }
  });
  resetBtn.addEventListener('click', rebuildDeck);

  buildLevelChips();
  rebuildDeck();
})();
</script>
</body></html>
